# Story 2: dynamic ingestion (Internet, versioning, vendor webhooks, file watcher).
server:
  port: 8080

spring:
  application:
    name: ingest-dynamic
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ragdb}
    username: ${DB_USER:rag}
    password: ${DB_PASSWORD:}
  ai:
    openai:
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://api.openai.com}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        # Only ingest-static creates the table; the others expect it to exist.
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # Must match the embedding model output size.
        dimensions: ${EMBEDDING_DIMENSIONS:1536}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

app:
  resources:
    path: ${APP_RESOURCES_PATH:./resources}
  watcher:
    enabled: true
    debounce-ms: 2000
  webhook:
    # HMAC secret used to verify vendor notifications. Never commit a real value.
    secret: ${APP_WEBHOOK_SECRET:}
  ingest:
    # Comma-separated allowlist, for example docs.example.com,github.com
    allowed-domains: ${APP_INGEST_ALLOWED_DOMAINS:}
    max-size-mb: ${APP_INGEST_MAX_SIZE_MB:20}
    timeout-seconds: 10
    https-only: true
    block-private-networks: ${APP_INGEST_BLOCK_PRIVATE_NETWORKS:true}
  versioning:
    keep-old-versions: true
    # Retrieval defaults to is_latest=true unless a version is requested.
    default-latest-only: true
