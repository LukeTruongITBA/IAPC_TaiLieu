# Infrastructure: Spring Cloud Gateway (reactive), routes discovered from Eureka.
# Spring Cloud 2025.1 (Gateway 5.x) uses the spring.cloud.gateway.server.webflux prefix.
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # /ingest-static/**, /ingest-dynamic/**, /retrieval-pre/**, /retrieval-post/**
              enabled: true
              lower-case-service-id: true
          httpclient:
            connect-timeout: 2000
            response-timeout: 30s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
